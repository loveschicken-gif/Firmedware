name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx prisma validate
      - run: npm run lint
      - run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-secret-min-32-chars-long-value
          AUTH_URL: http://localhost:3000

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: firmedware
          POSTGRES_PASSWORD: firmedware
          POSTGRES_DB: firmedware
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U firmedware -d firmedware"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://firmedware:firmedware@localhost:5432/firmedware
      AUTH_SECRET: ci-secret-min-32-chars-long-value
      AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm test
